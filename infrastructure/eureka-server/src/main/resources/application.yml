server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Eureka server se ne registruje sam kod sebe
    register-with-eureka: false
    fetch-registry: false
  server:
    # brze uklanjanje ugasenih instanci u razvoju
    eviction-interval-timer-in-ms: 5000
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
