server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" = konfiguracija se cita iz foldera (config-repo), ne iz posebnog git repoa
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
