server:
  port: 8083

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}

management:
  endpoints:
    web:
      exposure:
        # /actuator/circuitbreakers prikazuje stanje "osiguraca" (CLOSED / OPEN / HALF_OPEN)
        include: health,info,circuitbreakers
