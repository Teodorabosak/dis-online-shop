spring:
  application:
    name: order-service
  config:
    # port i adrese baze/RabbitMQ-a dolaze sa config servera (config-repo/order-service.yml)
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  cloud:
    function:
      # Consumer bean-ovi koje Spring Cloud Stream vezuje za RabbitMQ
      definition: paymentResult
    stream:
      bindings:
        # izlaz: OrderService salje OrderCreated preko StreamBridge-a
        orderCreated-out-0:
          destination: orders
        # ulaz: rezultati placanja; "group" = trajni red payments.order-service
        paymentResult-in-0:
          destination: payments
          group: order-service
      rabbit:
        bindings:
          paymentResult-in-0:
            consumer:
              # poruka koja ne uspe ni posle 3 pokusaja ide u "dead letter" red
              auto-bind-dlq: true

app:
  services:
    product-url: http://product-service
    inventory-url: http://inventory-service

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # 4xx odgovori (nema proizvoda, nema robe) su poslovni odgovori, ne kvar servisa
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      product:
        base-config: default
      inventory:
        base-config: default
